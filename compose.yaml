name: pulse-monitor

x-backend: &backend
  build: ./backend
  image: pulse-monitor-backend:local
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  environment:
    APP_ENV: ${APP_ENV:-development}
    APP_DEBUG: ${APP_DEBUG:-false}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-pulse_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-pulse_monitor}}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
    JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
    MAX_MONITORS_PER_USER: ${MAX_MONITORS_PER_USER:-20}
    CHECK_RETENTION_DAYS: ${CHECK_RETENTION_DAYS:-30}
    DEMO_MODE: ${DEMO_MODE:-false}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    networks: [application, data, api-egress]
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8

  celery-worker:
    <<: *backend
    networks: [data, worker-egress]
    command: ["celery", "-A", "app.celery_app:celery", "worker", "--hostname=pulse@%h", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery inspect ping -d pulse@$$HOSTNAME --timeout=4"]
      interval: 30s
      timeout: 8s
      retries: 5

  celery-beat:
    <<: *backend
    networks: [data]
    command: ["celery", "-A", "app.celery_app:celery", "beat", "--loglevel=INFO", "--pidfile=/tmp/pulse-beat.pid", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(int(open('/tmp/pulse-beat.pid').read().strip()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    image: pulse-monitor-frontend:local
    restart: unless-stopped
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-80}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [application, edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  data:
    internal: true
  application:
    internal: true
  edge: {}
  api-egress: {}
  worker-egress:
    driver_opts:
      com.docker.network.bridge.name: br-pulse-check

volumes:
  postgres:
  redis:
